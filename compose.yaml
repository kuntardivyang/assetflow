# One-command demo: `docker compose up --build`
# App on http://localhost:3000 (stop any local dev server first).
# Postgres stays inside the compose network — no host port, so it won't
# clash with a Postgres you already run locally.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assetflow
      # Local-only demo password — safe because the DB port below is NOT
      # published to the host, so the database is only reachable inside the
      # compose network by the app service.
      POSTGRES_PASSWORD: assetflow
      POSTGRES_DB: assetflow
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://assetflow:assetflow@db:5432/assetflow?schema=public
      # Required from the environment — never commit a signing key. Generate one
      # with `npx auth secret` and put it in .env (compose reads it automatically).
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — generate with: npx auth secret}
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
